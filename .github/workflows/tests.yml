name: Tests

on:
  push:
    branches: '**'
  pull_request:
    branches: '**'

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run tests
        run: python3 tests/test_snapshot_restore.py
